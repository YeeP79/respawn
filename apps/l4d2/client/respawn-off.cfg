// respawn — undo the bot macros
//
//   exec respawn-off
//
// WHY THIS EXISTS AND WHY DELETING respawn.cfg IS NOT ENOUGH
// Source writes binds into config.cfg when the game exits, so a key bound by
// `exec respawn` STAYS bound after respawn.cfg is deleted. "Remove the file to revert"
// is true of most cfg content and false of exactly this part, which is the kind of
// thing you find out three sessions later wondering why F1 stopped voting.
//
// The three restores below are L4D2's own defaults, read out of config.cfg before the
// macros were first installed — not guesses.

// ---- restore what the macros displaced --------------------------------------
bind "F1" "Vote Yes"
bind "F2" "Vote No"
bind "F3" "askconnect_accept"

// ---- release the rest -------------------------------------------------------
unbind "F4"
unbind "F6"
unbind "F7"
unbind "F8"
unbind "F9"
unbind "F11"
unbind "F12"
unbind "\\"

echo "[respawn] macros off. F1/F2 vote again, F3 accepts invites."
