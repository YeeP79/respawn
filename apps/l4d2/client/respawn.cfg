// respawn — one-key bot macros for Left 4 Dead 2
//
//   Put this in:  Left 4 Dead 2/left4dead2/cfg/respawn.cfg
//   Then in the developer console, once per session:  exec respawn
//
// WHY THIS EXISTS
// Typing a sentence mid-horde is not a real interaction. These bind the common
// intents to single keys; typed chat stays available for the rare case where you
// actually have a moment and want something the macros do not cover.
//
// Everything here is ordinary `say` — the server plugin reads chat, resolves the
// @tag, freezes your position and aim at that instant, and hands it to the agent.
// Nothing here needs a mod on your side.

// ---- addressing -------------------------------------------------------------
//   @team     everyone
//   @closest  the bot nearest you, resolved server-side at the moment you press it
//   @coach    a bot by name

// F-keys, so this works on a 75% board with no numpad. F5 is deliberately skipped
// (Source binds it to a screenshot) and so is F10 (quit menu on some configs).
//
// THREE OF THESE DISPLACE REAL DEFAULTS, and it is worth knowing which:
//   F1  Vote Yes           <- gone while the macros are on
//   F2  Vote No            <- gone
//   F3  askconnect_accept  <- gone (accepting a friend's invite)
// With one human and three bots nothing votes, so the trade is free; with two or more
// humans it is not, and votes are how a coop lobby changes level or kicks somebody.
//
// `exec respawn-off` puts all three back. That file exists because DELETING THIS ONE
// DOES NOT UNDO ANYTHING: Source writes binds into config.cfg on exit, so a key bound
// here stays bound after this file is gone.
//
// ---- agent-mediated: you state intent, the agent picks the order --------------
bind "F1"  "say @team regroup on me"
bind "F2"  "say @closest cover this spot"
bind "F3"  "say @team hold here"
bind "F4"  "say @team move up"
bind "F6"  "say @closest heal me"
bind "F7"  "say @closest shoot what I shoot"
bind "F8"  "say @team focus the biggest threat"
bind "F9"  "say @team stop what you are doing"

// ---- L4B direct: no agent in the loop, zero latency -------------------------
// For anything where a second of lag is unacceptable. These do not reach the agent.
bind "F11" "scripted_user_func l4b,bots,wait"
bind "F12" "scripted_user_func l4b,bots,follow,me"
bind "\\" "scripted_user_func l4b,botselect"

echo "[respawn] F1-F4,F6-F9 = agent intents. F11/F12/\\ = direct to bots, no latency."
